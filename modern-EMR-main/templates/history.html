{% extends "base.html" %}
{% block content %}
<h2>Prescription History</h2>
<table class="table">
    <tr>
        <th>Patient Name</th>
        <th>Date</th>
        <th>Action</th>
    </tr>
    {% for prescription in prescriptions %}
    <tr>
        <td>{{ prescription.name }}</td>
        <td>{{ prescription.date.strftime('%d-%m-%Y') }}</td>
        <td>
            <a href="{{ url_for('generate_pdf', id=prescription.id) }}" class="btn btn-sm btn-success">Download PDF</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
