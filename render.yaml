# Render Blueprint — Endo EMR (FastAPI + React + PostgreSQL)
# Deploy: Render Dashboard → New → Blueprint → connect this repo
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: endo-emr-db
    databaseName: endo_emr
    user: endo_emr
    plan: free

services:
  # FastAPI backend (Docker — includes WeasyPrint PDF dependencies)
  - type: web
    name: endo-emr-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: endo-emr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: SEED_ON_STARTUP
        value: "false"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: endo-emr-web
          envVarKey: RENDER_EXTERNAL_URL

  # React frontend (static build — no plan field; static sites are billed separately)
  - type: web
    name: endo-emr-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: endo-emr-api
          envVarKey: RENDER_EXTERNAL_URL
